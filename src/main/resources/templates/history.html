<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('历史记录')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-clock-history me-2"></i>历史记录</h2>
        <a href="/upload" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>新建转换
        </a>
    </div>

    <div id="historyList" class="list-group">
        <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="mt-3 text-muted">加载中...</p>
        </div>
    </div>

    <nav id="paginationNav" class="mt-4 d-none">
        <ul class="pagination justify-content-center" id="pagination"></ul>
    </nav>
</nav>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

<script>
let currentPage = 0;
const pageSize = 10;

document.addEventListener('DOMContentLoaded', function() {
    loadHistory();
});

function loadHistory(page) {
    currentPage = page || 0;
    fetch(`/api/novels?page=${currentPage}&size=${pageSize}`)
        .then(res => res.json())
        .then(result => {
            if (result.code === 200) {
                renderHistory(result.data);
            }
        });
}

function renderHistory(pageData) {
    const container = document.getElementById('historyList');
    if (pageData.content.length === 0) {
        container.innerHTML = `
            <div class="text-center py-5">
                <i class="bi bi-inbox display-1 text-muted"></i>
                <p class="mt-3 text-muted">暂无记录</p>
                <a href="/upload" class="btn btn-primary">上传小说</a>
            </div>`;
        return;
    }

    container.innerHTML = pageData.content.map(novel => `
        <div class="list-group-item list-group-item-action">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <div class="file-icon me-3">
                        <i class="bi ${getFileIcon(novel.fileType)} display-6"></i>
                    </div>
                    <div>
                        <h5 class="mb-1">${novel.originalFilename}</h5>
                        <small class="text-muted">
                            ${novel.fileType.toUpperCase()} · ${novel.fileSizeFormatted} · ${formatTime(novel.uploadTime)}
                        </small>
                    </div>
                </div>
                <div class="d-flex align-items-center">
                    <span class="badge ${getStatusBadgeClass(novel.status)} me-3">${novel.status}</span>
                    <div class="btn-group">
                        <a href="/script?novelId=${novel.id}" class="btn btn-sm btn-outline-primary" title="查看剧本">
                            <i class="bi bi-eye"></i>
                        </a>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteNovel(${novel.id})" title="删除">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `).join('');

    renderPagination(pageData);
}

function renderPagination(pageData) {
    const nav = document.getElementById('paginationNav');
    const container = document.getElementById('pagination');

    if (pageData.totalPages <= 1) {
        nav.classList.add('d-none');
        return;
    }

    nav.classList.remove('d-none');
    let html = '';

    html += `<li class="page-item ${currentPage === 0 ? 'disabled' : ''}">
        <a class="page-link" href="#" onclick="loadHistory(${currentPage - 1}); return false;">上一页</a>
    </li>`;

    for (let i = 0; i < pageData.totalPages; i++) {
        if (i === 0 || i === pageData.totalPages - 1 || Math.abs(i - currentPage) <= 2) {
            html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                <a class="page-link" href="#" onclick="loadHistory(${i}); return false;">${i + 1}</a>
            </li>`;
        } else if (Math.abs(i - currentPage) === 3) {
            html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
        }
    }

    html += `<li class="page-item ${currentPage === pageData.totalPages - 1 ? 'disabled' : ''}">
        <a class="page-link" href="#" onclick="loadHistory(${currentPage + 1}); return false;">下一页</a>
    </li>`;

    container.innerHTML = html;
}

function deleteNovel(id) {
    if (!confirm('确定要删除这个小说及其剧本吗？此操作不可撤销。')) return;

    fetch(`/api/novel/${id}`, { method: 'DELETE' })
        .then(res => res.json())
        .then(result => {
            if (result.code === 200) {
                loadHistory(currentPage);
            } else {
                alert('删除失败: ' + result.message);
            }
        });
}

function getFileIcon(fileType) {
    switch(fileType) {
        case 'txt': return 'bi-file-text';
        case 'md': return 'bi-markdown';
        case 'docx': return 'bi-file-word';
        default: return 'bi-file';
    }
}

function getStatusBadgeClass(status) {
    if (status.includes('已上传') || status.includes('已解析')) return 'bg-primary';
    if (status.includes('转换中')) return 'bg-warning text-dark';
    if (status.includes('已完成')) return 'bg-success';
    if (status.includes('失败')) return 'bg-danger';
    return 'bg-secondary';
}

function formatTime(timeStr) {
    if (!timeStr) return '';
    const date = new Date(timeStr);
    return date.toLocaleString('zh-CN');
}
</script>
</body>
</html>
