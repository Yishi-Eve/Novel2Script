server:
  port: 8080

spring:
  application:
    name: novel-to-script
  
  datasource:
    url: jdbc:mysql://localhost:3306/novel2script?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

# 百炼API配置
bailian:
  api-key: sk-5654309a2290464dadbf8c738aa91b16
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen3.6-plus
  max-tokens: 8192
  temperature: 0.7

# 文件存储配置
storage:
  base-path: ./uploads
  novel-path: ${storage.base-path}/novels
  script-path: ${storage.base-path}/scripts

# 日志配置
logging:
  level:
    com.qiniu.novel2script: DEBUG
    org.springframework.web: INFO
