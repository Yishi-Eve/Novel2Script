server:
  port: 8080

spring:
  application:
    name: novel-to-script
  
  datasource:
    url: jdbc:mysql://localhost:3306/novel2script?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  type-aliases-package: com.qiniu.novel2script.entity
  mapper-locations: classpath:mapper/*.xml

# LangChain4j配置
langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: ${BaiLian_QiNiu_API_KEY}
        model-name: qwen3.6-plus
        max-tokens: 8192
        temperature: 0.3
        max-retries: 3
        log-requests: true
        log-responses: true

# 文件存储配置
storage:
  base-path: ./uploads
  novel-path: ${storage.base-path}/novels
  script-path: ${storage.base-path}/scripts
  chapter-path: ${storage.base-path}/chapters

# 文本解析配置
text-parser:
  max-file-size: 10485760
  supported-types:
    - txt
    - md
    - docx
  default-encoding: UTF-8
  clean:
    remove-extra-blank-lines: true
    max-consecutive-blank-lines: 2
    trim-lines: true

# 日志配置
logging:
  level:
    com.qiniu.novel2script: DEBUG
    org.springframework.web: INFO
